<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title description">
  <title id="title">Página inicial do Meu Espaço</title>
  <desc id="description">Prévia ilustrada da landing page com identidade verde e cinza, apresentação do produto e um resumo das áreas do gerenciador.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8ebe5"/>
      <stop offset=".58" stop-color="#dce1dc"/>
      <stop offset="1" stop-color="#d2ded9"/>
    </linearGradient>
    <linearGradient id="preview" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfbf7"/>
      <stop offset="1" stop-color="#f0f2eb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#34463a" flood-opacity=".14"/>
    </filter>
  </defs>
  <rect width="1440" height="760" rx="28" fill="url(#background)"/>
  <circle cx="1338" cy="86" r="192" fill="#fff" opacity=".18"/>
  <circle cx="80" cy="692" r="220" fill="#fff" opacity=".13"/>
  <rect x="1" y="1" width="1438" height="758" rx="27" fill="none" stroke="#fff" stroke-opacity=".72"/>

  <rect x="48" y="34" width="1344" height="78" rx="15" fill="#f6f6f0" fill-opacity=".94"/>
  <rect x="76" y="53" width="39" height="39" rx="12" fill="#426b55"/>
  <text x="95.5" y="81" text-anchor="middle" fill="#fbfbf7" font-family="Georgia,serif" font-size="25" font-weight="700">m</text>
  <text x="126" y="80" fill="#284434" font-family="Georgia,serif" font-size="23" font-weight="700">meu espaço</text>
  <text x="803" y="81" fill="#416b54" font-family="Arial,sans-serif" font-size="14" font-weight="700">Início</text>
  <text x="884" y="81" fill="#667269" font-family="Arial,sans-serif" font-size="14">O que oferece</text>
  <text x="1019" y="81" fill="#667269" font-family="Arial,sans-serif" font-size="14">Sobre</text>
  <text x="1082" y="81" fill="#667269" font-family="Arial,sans-serif" font-size="14">Contato</text>
  <text x="1164" y="81" fill="#667269" font-family="Arial,sans-serif" font-size="14">Entrar</text>
  <rect x="1230" y="52" width="134" height="42" rx="9" fill="#426b55"/>
  <text x="1297" y="78" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="14" font-weight="700">Minhas tarefas</text>

  <text x="90" y="223" fill="#347778" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2">MENOS COISAS NA CABEÇA, MAIS CLAREZA NO DIA</text>
  <text x="87" y="310" fill="#29372e" font-family="Georgia,serif" font-size="76">Meu Espaço<tspan fill="#ce745c">.</tspan></text>
  <text x="92" y="365" fill="#657168" font-family="Arial,sans-serif" font-size="20">Um lugar simples para organizar tarefas, guardar ideias,</text>
  <text x="92" y="397" fill="#657168" font-family="Arial,sans-serif" font-size="20">lembrar compromissos e acompanhar os planos que</text>
  <text x="92" y="429" fill="#657168" font-family="Arial,sans-serif" font-size="20">importam para você.</text>
  <rect x="92" y="469" width="225" height="58" rx="11" fill="#426b55"/>
  <text x="119" y="505" fill="#fff" font-family="Arial,sans-serif" font-size="16" font-weight="700">Quero me organizar</text>
  <text x="287" y="505" fill="#fff" font-family="Arial,sans-serif" font-size="20">→</text>
  <text x="92" y="569" fill="#347778" font-family="Arial,sans-serif" font-size="16" text-decoration="underline">Já tenho cadastro</text>
  <circle cx="100" cy="630" r="13" fill="#fff" fill-opacity=".75"/>
  <text x="100" y="636" text-anchor="middle" fill="#ce745c" font-family="Arial,sans-serif" font-size="18">✳</text>
  <text x="124" y="635" fill="#68746b" font-family="Arial,sans-serif" font-size="15">Comece pelo que está no seu alcance. O resto vem aos poucos.</text>

  <g filter="url(#shadow)">
    <rect x="731" y="160" width="622" height="518" rx="24" fill="url(#preview)"/>
  </g>
  <rect x="731" y="160" width="622" height="72" rx="24" fill="#fbfbf7"/>
  <path d="M731 208v24h622v-24" fill="#fbfbf7"/>
  <rect x="765" y="178" width="37" height="37" rx="11" fill="#426b55"/>
  <text x="783.5" y="204" text-anchor="middle" fill="#fbfbf7" font-family="Georgia,serif" font-size="23" font-weight="700">m</text>
  <text x="815" y="203" fill="#304638" font-family="Georgia,serif" font-size="21" font-weight="700">meu espaço</text>
  <text x="1125" y="202" fill="#758078" font-family="Arial,sans-serif" font-size="13">Seu dia, em perspectiva</text>
  <text x="770" y="277" fill="#347778" font-family="Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1.7">DO SEU JEITO</text>
  <text x="768" y="313" fill="#29372e" font-family="Georgia,serif" font-size="26">Mais espaço para pensar.</text>
  <rect x="770" y="337" width="544" height="1" fill="#e6e8df"/>

  <rect x="770" y="365" width="544" height="65" rx="10" fill="#f4f5ef"/>
  <circle cx="798" cy="397" r="16" fill="#e4eeea"/>
  <text x="798" y="403" text-anchor="middle" fill="#347778" font-family="Arial,sans-serif" font-size="15">☑</text>
  <text x="830" y="394" fill="#304638" font-family="Arial,sans-serif" font-size="15" font-weight="700">Priorize suas tarefas</text>
  <text x="830" y="414" fill="#7a8379" font-family="Arial,sans-serif" font-size="12">Um passo de cada vez</text>
  <text x="1272" y="402" fill="#ce745c" font-family="Arial,sans-serif" font-size="16">01</text>

  <rect x="770" y="443" width="544" height="65" rx="10" fill="#f4f5ef"/>
  <circle cx="798" cy="475" r="16" fill="#e8ece2"/>
  <text x="798" y="481" text-anchor="middle" fill="#687e5b" font-family="Arial,sans-serif" font-size="15">✎</text>
  <text x="830" y="472" fill="#304638" font-family="Arial,sans-serif" font-size="15" font-weight="700">Guarde suas ideias</text>
  <text x="830" y="492" fill="#7a8379" font-family="Arial,sans-serif" font-size="12">Listas, lembretes e inspirações</text>
  <text x="1272" y="480" fill="#ce745c" font-family="Arial,sans-serif" font-size="16">02</text>

  <rect x="770" y="521" width="544" height="65" rx="10" fill="#f4f5ef"/>
  <circle cx="798" cy="553" r="16" fill="#e5eded"/>
  <text x="798" y="559" text-anchor="middle" fill="#347778" font-family="Arial,sans-serif" font-size="15">▦</text>
  <text x="830" y="550" fill="#304638" font-family="Arial,sans-serif" font-size="15" font-weight="700">Acompanhe seus planos</text>
  <text x="830" y="570" fill="#7a8379" font-family="Arial,sans-serif" font-size="12">Agenda, progresso e objetivos</text>
  <text x="1272" y="558" fill="#ce745c" font-family="Arial,sans-serif" font-size="16">03</text>

  <rect x="770" y="611" width="544" height="1" fill="#e6e8df"/>
  <text x="770" y="640" fill="#347778" font-family="Arial,sans-serif" font-size="13">Organize no seu ritmo</text>
  <text x="1280" y="640" text-anchor="end" fill="#8b958b" font-family="Arial,sans-serif" font-size="13">Simples. Pessoal. Seu.</text>
</svg>
